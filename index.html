<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Project_Maneger</title>
  </head>
  <body>
    <h1 class="header">Project Manager</h1>
    <form action="" id="course-form">
      <div class="search-container">
        <input type="search" id="search" placeholder="Search courses..." />
      </div>

      <div class="contant">
        <div class="title">
          <label class="l1" for="title"> Title: </label>
          <input
            id="title"
            type="text"
            placeholder="Enter_your_project_title"
          />
        </div>
        <div class="description">
          <label id="l2" for="description"> Description: </label>
          <input
            id="description"
            type="text"
            placeholder="Enter_your_project_Description"
          />
        </div>
        <button id="submit">Add Cource</button>
      </div>
    </form>
    <div id="coureses-contant"></div>
    <script src="./js/script.js"></script>
  </body>
</html>
